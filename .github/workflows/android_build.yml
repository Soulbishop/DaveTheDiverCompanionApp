name: Build Dave Diver APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2
    
    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './DaveTheDiverApp/package-lock.json'
    
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.2
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Install Node.js dependencies
      working-directory: ./DaveTheDiverApp
      run: npm ci
    
    - name: Make gradlew executable
      working-directory: ./DaveTheDiverApp
      run: chmod +x android/gradlew
    
    - name: Clean Android build
      working-directory: ./DaveTheDiverApp
      run: |
        cd android
        ./gradlew clean
    
    - name: Build Debug APK
      working-directory: ./DaveTheDiverApp
      run: |
        cd android
        ./gradlew assembleDebug
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: dave-diver-companion-app-debug
        path: DaveTheDiverApp/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: DaveTheDiverApp/android/app/build/outputs/logs/
        retention-days: 7

