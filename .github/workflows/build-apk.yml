name: Build Dave Diver Companion APK

on:
  push:
    branches: [ main, DaveTheDiverFoundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
          
      - name: Setup Expo CLI
        run: npm install -g @expo/cli eas-cli
        
      - name: Install dependencies
        run: npm ci
        
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Initialize EAS project
        run: eas init --non-interactive --force
          
      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
        
      - name: Download APK
        # This step is corrected to download the APK using the build URL.
        # It extracts the URL from the previous 'Build APK' step's output.
        run: |
          # Use grep to find the line containing the build URL from the summary of the previous step.
          # The $GITHUB_STEP_SUMMARY environment variable holds this information.
          # Then, use awk to extract just the URL, which is the last field ($NF) on that line.
          BUILD_URL=$(grep "See logs: https://expo.dev/" $GITHUB_STEP_SUMMARY | awk '{print $NF}')
          
          # Check if the BUILD_URL was successfully extracted.
          if [ -z "$BUILD_URL" ]; then
            echo "Error: Could not find the build URL in the previous step's logs."
            exit 1
          fi
          
          echo "Discovered build URL: $BUILD_URL"
          
          # Use the extracted URL with 'eas build:download' to fetch the APK.
          # The --platform android flag ensures we target the correct platform.
          eas build:download --url "$BUILD_URL" --platform android
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dave-diver-companion-apk
          path: '**/*.apk'
          retention-days: 30
