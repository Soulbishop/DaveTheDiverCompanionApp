name: Build Dave Diver Companion APK

on:
  push:
    branches: [ main, DaveTheDiverFoundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
          
      - name: Setup Expo CLI
        run: npm install -g @expo/cli eas-cli
        
      - name: Install dependencies
        run: npm ci
        
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Initialize EAS project
        run: eas init --non-interactive --force
          
      - name: Build APK & Extract URL # Modified to output JSON and extract the APK URL
        id: build_apk_step # Assign an ID to this step to reference its outputs
        run: |
          # Run eas build with --json to get structured output
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          echo "EAS Build JSON Output: $BUILD_OUTPUT" # For debugging purposes in logs
          
          # Use jq to parse the JSON and extract the direct application archive URL for the Android build.
          # We check for .artifacts.applicationArchiveUrl which is the direct APK link.
          APK_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.applicationArchiveUrl') # Assuming it's the first element in the array
          
          # Set the extracted URL as a step output, so the next step can access it.
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        
      - name: Download APK # Now uses curl to directly download the APK from the URL
        run: |
          # Retrieve the APK URL from the output of the previous step.
          DOWNLOAD_URL="${{ steps.build_apk_step.outputs.apk_url }}"
          
          # Basic error checking: if the URL wasn't found, print an error and exit.
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Could not find the APK download URL from the previous build step."
            exit 1
          fi
          
          echo "Attempting to download APK from: $DOWNLOAD_URL"
          
          # Use curl to download the APK.
          # -L: Follow redirects (important as Expo URLs might redirect)
          # -o app.apk: Save the downloaded file as 'app.apk'
          curl -L "$DOWNLOAD_URL" -o app.apk
          
          # Verify that the file was downloaded (optional, but good practice)
          if [ ! -f "app.apk" ]; then
            echo "Error: app.apk was not downloaded successfully."
            exit 1
          fi
          echo "APK downloaded as app.apk"
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dave-diver-companion-apk
          path: '**/*.apk' # This will now find the 'app.apk' we downloaded
          retention-days: 30
