name: Build APK without Expo Queue

on:
  push:
    branches: [ main, Add-sushi, Table-tuning, buildchange ]
  pull_request:
    branches: [ main, buildchange ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Setup EAS CLI
      run: npm install -g eas-cli

    - name: Configure EAS project
      run: eas build:configure --platform android --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    - name: Build APK locally
      run: |
        # Use local build instead of cloud build - no more queues!
        eas build --platform android --profile preview --local --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dave-diver-apk-${{ github.sha }}
        path: '**/*.apk'
        retention-days: 30

    - name: Create Release (on main or buildchange branch)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/buildchange') && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}-${{ github.ref_name }}
        name: Dave Diver Companion v${{ github.run_number }} (${{ github.ref_name }})
        body: |
          🎮 Dave the Diver Companion App
          
          **Build Info:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Build: ${{ github.run_number }}
          
          **Changes:**
          ${{ github.event.head_commit.message }}
        files: '**/*.apk'
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

