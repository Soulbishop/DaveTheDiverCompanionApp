name: Build Dave Diver Companion APK

on:
  push:
    branches: [ main, DaveTheDiverFoundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
          
      - name: Setup Expo CLI
        run: npm install -g @expo/cli eas-cli
        
      - name: Install dependencies
        run: npm ci
        
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Initialize EAS project
        run: eas init --non-interactive --force
          
      - name: Build APK # Modified to output JSON and save to a job output
        id: build_apk_step # Assign an ID to this step to reference its outputs
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          echo "EAS Build JSON Output: $BUILD_OUTPUT" # For debugging
          
          # Extract the Android APK URL using jq from the JSON output
          # .[] iterates over the array if there are multiple builds (e.g., android and ios)
          # select(.platform=="ANDROID") filters for the Android build object
          # .artifacts.applicationArchiveUrl gets the download URL
          APK_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[] | select(.platform=="ANDROID") | .artifacts.applicationArchiveUrl')
          
          # Set the extracted URL as a step output, so subsequent steps can access it.
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        
      - name: Download APK # Modified to use the URL from the previous step's output
        run: |
          BUILD_URL="${{ steps.build_apk_step.outputs.apk_url }}"
          
          # Basic error checking: if the URL wasn't found, print an error and exit.
          if [ -z "$BUILD_URL" ]; then
            echo "Error: Could not find the build URL from the previous build step's output."
            exit 1
          fi
          
          echo "Discovered build URL for download: $BUILD_URL"
          
          # Use the extracted URL with 'eas build:download' to fetch the APK.
          eas build:download --url "$BUILD_URL" --platform android
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dave-diver-companion-apk
          path: '**/*.apk'
          retention-days: 30
